[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "viz-python-lib"
version = "1.1.0"
description = "Python library for VIZ blockchain"
authors = ["Vladimir Kamarzin <vvk@vvk.pp.ru>", "Vladimir Babin <vovababin@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/VIZ-Blockchain/viz-python-lib"
packages = [
    { include = "viz" },
    { include = "vizapi" },
    { include = "vizbase" },
]

keywords = ['viz', 'python', 'library', 'blockchain']

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]


[tool.poetry.dependencies]
python = "^3.9"
graphenelib = "^1.6.0"
toolz = "^0.12.0"
funcy = "^2.0"
aiohttp = ">=3.8,<4"
docker = "^7.1.0"


[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6"
ruff = "^0.1"
mypy = "^1.8"
pytest = "^8.0"
pytest-cov = "^5.0"

sphinx = "^2.2"
sphinx-autoapi = "^1.4.0"
# used in docs to include markdown files
m2r = "^0.3.1"
# used in docs to parse pyproject.toml
tomlkit = "^0.11.8"


[tool.pytest.ini_options]
norecursedirs = ["*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]
addopts = [
  "--strict-markers",
  "--doctest-modules",
  "--cov=viz",
  "--cov=vizbase",
  "--cov=vizapi",
  "--cov-report=term:skip-covered",
  "--cov-report=xml",
  "--cov-branch",
]


[tool.mypy]
ignore_missing_imports = true


[tool.ruff]
line-length = 120
target-version = "py39"


[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle, pyflakes
  "I",               # isort
  "B",               # bugbear
  "C4",              # comprehensions
  "UP",              # pyupgrade
]
ignore = [
  "E501",  # line-length handled by formatter
]


[tool.ruff.lint.isort]
known-third-party = [
  "Crypto",
  "docker",
  "grapheneapi",
  "graphenebase",
  "graphenecommon",
  "graphenestorage",
  "pytest",
  "tomlkit",
  "toolz",
]
