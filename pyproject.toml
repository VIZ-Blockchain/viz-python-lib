[build-system]
requires = ["poetry-core>=2.5.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "viz-python-lib"
version = "1.4.0"
description = "Python library for VIZ blockchain"
authors = ["Vladimir Kamarzin <vvk@vvk.pp.ru>", "Vladimir Babin <vovababin@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/VIZ-Blockchain/viz-python-lib"
packages = [
    { include = "viz" },
    { include = "vizapi" },
    { include = "vizbase" },
]

keywords = ['viz', 'python', 'library', 'blockchain']

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]


[tool.poetry.dependencies]
python = "^3.10"
graphenelib = "^1.6.1"
toolz = "^1.2.0"
funcy = "^2.1"
aiohttp = "^3.14.5"
docker = "^7.2.0"


[tool.poetry.group.dev.dependencies]
# Patched filelock requires Python 3.11+. Keep runtime/test support for 3.10,
# but run the optional pre-commit tooling on a supported patched interpreter.
pre-commit = { version = "^4.7.0", python = ">=3.11" }
filelock = { version = ">=4.2.1,<5", python = ">=3.11" }
ruff = "^0.17.2"
mypy = "^2.4"
pytest = "^9.1.1"
pytest-cov = "^7.1"

sphinx = [
    { version = ">=8.1.3,<9", python = ">=3.10,<3.11" },
    { version = ">=9.0.4,<9.1", python = ">=3.11,<3.12" },
    { version = ">=9.1.1,<9.2", python = ">=3.12,<3.13" },
    { version = "^9.2.0", python = ">=3.13" },
]
sphinx-autoapi = "^3.8.1"
# used in docs to include markdown files
m2r2 = "^2.1"
# used in docs to parse pyproject.toml
tomlkit = "^0.15.2"


[tool.pytest.ini_options]
norecursedirs = ["*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]
addopts = [
  "--strict-markers",
  "--doctest-modules",
  "--cov=viz",
  "--cov=vizbase",
  "--cov=vizapi",
  "--cov-report=term:skip-covered",
  "--cov-report=xml",
  "--cov-branch",
]


[tool.mypy]
ignore_missing_imports = true


[tool.ruff]
line-length = 120
target-version = "py310"


[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle, pyflakes
  "I",               # isort
  "B",               # bugbear
  "C4",              # comprehensions
  "UP",              # pyupgrade
]
ignore = [
  "E501",  # line-length handled by formatter
]


[tool.ruff.lint.isort]
known-third-party = [
  "Crypto",
  "docker",
  "grapheneapi",
  "graphenebase",
  "graphenecommon",
  "graphenestorage",
  "pytest",
  "tomlkit",
  "toolz",
]
